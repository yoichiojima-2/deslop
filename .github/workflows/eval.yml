name: eval
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 * *"   # monthly: the set decays as slop generators change
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python eval/run.py --show-misses
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
