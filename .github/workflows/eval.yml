name: eval
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 1 * *"   # monthly: the set decays as slop generators change
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: eval
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::notice::TYPESAFE_API_KEY not available to this pull request; eval skipped"
              exit 0
            fi
            echo "::error::TYPESAFE_API_KEY secret is not set (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          python eval/run.py --show-misses
